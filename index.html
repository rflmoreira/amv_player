<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Player</title>
  <link rel="icon" type="image/x-icon" href="" />
  <link rel="apple-touch-icon" sizes="180x180" href="" />
  <link rel="icon" type="image/png" sizes="32x32" href="" />
  <link rel="icon" type="image/png" sizes="16x16" href="" />
  <link rel="manifest" href="./src/favicon/site.webmanifest" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Vídeo de fundo ocupa toda a tela -->
  <video id="bg-video" playsinline style="position:fixed;top:0;left:0;width:100vw;height:100vh;object-fit:cover;z-index:-1"></video>
  
  <!-- Playlist separada do player -->
  <div id="playlistSection">
    <div class="header">
      <h4>Playlist</h4>
      <button id="playlistCloseButton" aria-label="Fechar Playlist">
        <i class="bx bx-x"></i>
      </button>
    </div>
    <ul id="playlistItems"></ul>
  </div>
  
  <main>
    <div class="player" id="main-player">
      <!-- Cabeçalho do player -->
      <div class="player-header">
        <!-- Botão para minimizar o player -->
        <button id="minimizeButton" aria-label="Minimizar Player" title="Minimizar Player">
            <i class='bx bx-chevron-down'></i>
        </button>

        <!-- Novo player de vídeo -->
        <div class="video-player-container">
          <canvas id="sync-canvas" width="640" height="360"></canvas>
        </div>

        <div class="current-track-info-wrapper">
          <div class="music-info">
            <div id="musicName"></div>
            <span class="music-author" id="musicAuthor"></span>
          </div>
          <!-- Animação de Onda -->
          <div id="wave-animation">
              <span class="wave-bar"></span>
              <span class="wave-bar"></span>
              <span class="wave-bar"></span>
              <span class="wave-bar"></span>
          </div>
        </div> 
      </div>
      <div class="footer">
        <div class="progress-bar">
          <div class="progress"></div>
        </div>
        <div class="time">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>
        <!-- Controles do player -->
        <div id="container-botoes">
          <button id="prevButton"><i style="font-size: 3rem;" class='bx bx-skip-previous-circle'></i></button>
          <button id="playPauseButton"><i style="font-size: 4rem;" class='bx bx-play-circle'></i></button>
          <button id="nextButton"><i style="font-size: 3rem;" class='bx bx-skip-next-circle'></i></button>
        </div>
        <!-- Botão de alternar playlist movido para cá -->
        <div class="footer-button-container">
          <button id="playlistToggleButton" aria-label="Alternar Playlist" title="Mostrar/Esconder Playlist">
            <i class='bx bx-dots-horizontal-rounded'></i>
          </button>
        </div>
        <div class="footer-button-container">
          <button id="pipButton">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <rect x="9" y="9" width="8" height="8" rx="1" ry="1"></rect>
            </svg>
            Ativar Picture-in-Picture
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Mini Player Flutuante (inicialmente escondido) -->
  <div id="mini-player" class="minimized">
    <button id="restoreButton" aria-label="Restaurar Player" title="Restaurar Player">
        <i class='bx bx-chevron-up'></i>
    </button>
    <div class="mini-player-content">
        <div class="mini-player-info">
            <div id="mini-music-name">Nome da Música</div>
            <div id="mini-music-author">Autor</div>
        </div>
        <div class="mini-player-controls">
            <button id="mini-play-pause-button" aria-label="Play/Pause/Stop"></button>
        </div>
    </div>
  </div>
  
  <script type="module" src="script.js"></script>
</body>
</html>
