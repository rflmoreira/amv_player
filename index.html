<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AniTune é um site dedicado à reprodução de músicas e vídeos AMV (Anime Music Video), oferecendo uma experiência imersiva para fãs de anime." />
  <title>anitune - amv player 🎧</title>
  <link rel="icon" type="image/png" href="src/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="src/favicon/favicon.svg" />
  <link rel="shortcut icon" href="src/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="src/favicon/apple-touch-icon.png" />
  <link rel="manifest" href="src/favicon/site.webmanifest" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <video id="bg-video" playsinline></video>
  <img id="custom-bg" alt="Background" style="position: fixed; inset: 0; z-index: -2; width: 100vw; height: 100vh; object-fit: cover; object-position: center; opacity: 1; pointer-events: none;" />

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const backgrounds = [
        {
          path: 'src/background/photo-1618519764620-7403abdbdfe9.jpg',
          sourceUrl: 'https://unsplash.com/pt-br/fotografias/o-dvd-da-teoria-do-big-bang-27kCu7bXGEI'
        },
        {
          path: 'src/background/photo-1625895197185-efcec01cffe0.jpg',
          sourceUrl: 'https://unsplash.com/pt-br/fotografias/mulher-de-cabelo-preto-na-estatueta-do-vestido-branco-e-vermelho-49X42qrgUmQ'
        },
        {
          path: 'src/background/photo-1613376023733-0a73315d9b06.jpg',
          sourceUrl: 'https://unsplash.com/pt-br/fotografias/foto-de-colagem-de-personagem-de-anime-na-prateleira-de-madeira-preta-IxDPZ-AHfoI'
        },
        {
          path: 'src/background/photo-1620336655055-088d06e36bf0.jpg',
          sourceUrl: 'https://unsplash.com/pt-br/fotografias/uma-pilha-de-historias-em-quadrinhos-sentada-em-cima-de-uma-mesa-OQgpRHFJwbQ'
        }
      ];

      const randomBgInfo = backgrounds[Math.floor(Math.random() * backgrounds.length)];
      const bgImg = document.getElementById('custom-bg');
      const bgLink = document.getElementById('bg-photo-link');

      if (bgImg) {
        bgImg.src = randomBgInfo.path;
      }

      if (bgLink && randomBgInfo.sourceUrl) {
        bgLink.href = randomBgInfo.sourceUrl;
      } else if (bgLink) {
        bgLink.style.display = 'none';
      }
    });
  </script>
  
  <div id="playlistSection">
    <div class="header">
      <h4>Playlist</h4>
      <button id="playlistCloseButton" aria-label="Fechar Playlist">
        <i class="bx bx-x"></i>
      </button>
    </div>
    <ul id="playlistItems"></ul>
  </div>
  
  <main>
    <div class="player minimized" id="main-player">
      <div class="player-header">
        <button id="minimizeButton" aria-label="Minimizar Player" title="Minimizar Player">
            <i class='bx bx-chevron-down'></i>
        </button>

        <div class="video-player-container">
          <canvas id="sync-canvas" width="640" height="360"></canvas>
        </div>

        <div class="current-track-info-wrapper">
          <div class="music-info">
            <div id="musicName"></div>
            <span class="music-author" id="musicAuthor"></span>
          </div>
          <div id="wave-animation">
              <span class="wave-bar"></span>
              <span class="wave-bar"></span>
              <span class="wave-bar"></span>
              <span class="wave-bar"></span>
          </div>
        </div> 
      </div>
      <div class="footer">
        <div class="progress-bar">
          <div class="progress"></div>
        </div>
        <div class="time">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>
        <div id="container-botoes">
          <button id="prevButton"><i style="font-size: 3rem;" class='bx bx-skip-previous-circle'></i></button>
          <button id="playPauseButton"><i style="font-size: 4rem;" class='bx bx-play-circle'></i></button>
          <button id="nextButton"><i style="font-size: 3rem;" class='bx bx-skip-next-circle'></i></button>
        </div>
        <div class="footer-button-container">
          <button id="playlistToggleButton" aria-label="Alternar Playlist" title="Mostrar/Esconder Playlist">
            <i class='bx bx-dots-horizontal-rounded'></i>
          </button>
        </div>
        <div class="footer-button-container">
          <button id="pipButton">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <rect x="9" y="9" width="8" height="8" rx="1" ry="1"></rect>
            </svg>
            Ativar Picture-in-Picture
          </button>
        </div>
      </div>
    </div>
  </main>

  <div id="mini-player">
    <button id="restoreButton" aria-label="Restaurar Player" title="Restaurar Player">
        <i class='bx bx-chevron-up'></i>
    </button>
    <div class="mini-player-content">
        <div class="mini-player-info">
            <div id="mini-music-name">Nome da Música</div>
            <div id="mini-music-author">Autor</div>
        </div>
        <div class="mini-player-controls">
            <button id="mini-play-pause-button" aria-label="Play/Pause/Stop"></button>
        </div>
    </div>
  </div>

<footer>
  <div class="copyright">
    <p>&copy; 2025 | Desenvolvido por <a href="https://github.com/rflmoreira" target="_blank" rel="noopener noreferrer">Rafael Moreira <i class='bx bx-link-external'></i></a> |
      <a id="bg-photo-link" href="" target="_blank" rel="noopener noreferrer">Foto de fundo <i class='bx bx-link-external'></i></a>
    </p>
  </div>
  <div class="legal-disclaimer">
    <p><strong>Aviso Legal:</strong> Este site não hospeda arquivos em seus servidores. Todo o conteúdo é disponibilizado por terceiros não afiliados.</p>
  </div>
</footer>
  
  <script type="module" src="script.js"></script>
</body>
</html>
